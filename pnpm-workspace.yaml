# esbuild's postinstall only checks the binary that @esbuild/<platform> already provides
allowBuilds:
  esbuild: false

# Solid's packages depend on each other through caret ranges, which resolve to the newest RC.
# Keep the whole set on the release TanStack Start is built against.
overrides:
  "@solidjs/signals": 2.0.0-rc.9
  "@solidjs/compiler": 2.0.0-rc.9
  "@solidjs/babel-plugin": 2.0.0-rc.9
